<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Trump Mad - Support Real Change</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main content wrapper -->
    <div class="content">
        <!-- Trump face area (upper section) -->
        <div class="face-section">
            <h1 class="headline">Make Trump Mad — Support Real Change.</h1>
            <div class="background-container">
                <div class="background-layer" data-layer="1"></div>
                <div class="background-layer" data-layer="2"></div>
                <div class="background-layer" data-layer="3"></div>
                <div class="background-layer" data-layer="4"></div>
                <div class="background-layer" data-layer="5"></div>
                <div class="background-layer" data-layer="6"></div>
            </div>
        </div>

        <!-- Donation form (lower section) -->
        <div class="form-wrapper">
            <div class="donation-section">
                <div class="donation-display">
                    <span class="donation-label">Donation:</span>
                    <span class="donation-amount" id="donationAmount">0 €</span>
                </div>

                <p class="subline">Slide to see how furious he gets when you donate.</p>

                <div class="slider-container">
                    <input
                        type="range"
                        min="0"
                        max="1000"
                        value="0"
                        class="slider"
                        id="donationSlider"
                    >
                    <div class="slider-labels">
                        <span>0 €</span>
                        <span>1000 €</span>
                    </div>
                </div>

                <p class="interaction-text" id="interactionText">Every euro pushes him closer to meltdown.</p>

                <button class="donate-button" id="donateButton">
                    Donate Now
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
